# Cloudflare Pages 配置
#
# 这个项目（Cloudflare 项目名 blog）的「变量」和「绑定」都由本文件托管，
# 所以面板上的 Variables 和 Bindings 是只读的 —— 要改就改这里，然后 git push。
#
# 相关：
#   - 静态产物目录：dist（面板 Build output 也是 dist）
#   - 点赞 / 阅读量 / 在线人数：functions/api/stats.ts + 下面的 KV 绑定

name = "blog"
pages_build_output_dir = "dist"
compatibility_date = "2025-01-01"

# 普通环境变量（构建时与运行时都可用）
[vars]
# 站点地址：影响 RSS、sitemap、canonical、分享卡片
SITE_URL = "https://blog-6tl.pages.dev"

# 以后绑了自定义域名，把上面那行改成你的域名，例如：
# SITE_URL = "https://liuyun.dev"

# KV 绑定：点赞 / 阅读量 / 在线人数的存储
# binding 必须叫 BLOG_KV（代码里写死的），id 是 KV 命名空间的 ID
[[kv_namespaces]]
binding = "BLOG_KV"
id = "3356ab9ea6c943d7bf040bde709dc9b9"
